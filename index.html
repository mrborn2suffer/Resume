<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 14px 20px;
            background-color: #161b22;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background-color: #21262d;
            border-color: #8b949e;
            color: #79c0ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Select Resume</h1>
    <div class="links">
        <a href="./haveloc-general.pdf" class="btn" target="_blank">Haveloc Resume</a>
        <a href="./resume.pdf" class="btn" target="_blank">Overleaf Resume</a>
    </div>
</div>

</body>
</html>
