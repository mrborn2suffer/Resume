<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Resume</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .card-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            display: block;
            padding: 16px 24px;
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #2563eb;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Select Resume</h1>
    <p>Choose a version to view or download</p>

    <div class="card-container">
        <a href="./resume-general.pdf" class="btn" target="_blank">📄 General / Software Engineer</a>
        <a href="./resume-backend.pdf" class="btn" target="_blank">⚙️ Backend / Systems Engineer</a>
    </div>
</div>

</body>
</html>
